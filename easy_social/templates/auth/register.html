{% extends "base.html" %}
{% block title %}Register - {{ brand_name }}{% endblock %}
{% block content %}
  <section class="auth-panel">
    <h1>Create account</h1>
    <form method="post" class="form-stack">
      <label>
        Username
        <input name="username" maxlength="40" autocomplete="username" required>
      </label>
      <label>
        Email
        <input name="email" type="email" autocomplete="email" required>
      </label>
      <label>
        Password
        <input name="password" type="password" autocomplete="new-password" required>
      </label>
      <div class="captcha-field">
        <span class="label-text">Verification code</span>
        <div class="captcha-row">
          <img
            id="captcha-image"
            src="{{ url_for('auth.captcha_image') }}"
            alt="Verification code"
            width="180"
            height="60"
          >
          <button type="button" class="secondary captcha-refresh" data-captcha-refresh>
            Refresh
          </button>
        </div>
        <input
          name="captcha"
          maxlength="5"
          autocomplete="off"
          autocapitalize="characters"
          spellcheck="false"
          required
          {% if captcha_test_answer %}data-testid="captcha-answer-hint" value="{{ captcha_test_answer }}"{% endif %}
        >
        <p class="muted">Enter the characters shown in the image.</p>
      </div>
      <button type="submit">Register</button>
    </form>
    <p class="muted">Already registered? <a href="{{ url_for('auth.login') }}">Log in</a>.</p>
  </section>
{% endblock %}
